# 第 6 周 · P1 服务编排
# 对应文档：第 6 周「能 docker-compose up 跑起来的 P1 项目」
# 要点：构建上下文是仓库根（要复用 week01~05 代码）；密钥从宿主环境注入。
services:
  p1-gateway:
    build:
      context: ../..
      dockerfile: week06/p1_fastapi/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # 留空时服务仍可用 Mock 模式启动，不会因缺 Key 直接崩溃
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 3
